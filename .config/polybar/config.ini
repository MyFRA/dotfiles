[colors]
;background = ${xrdb:color0:#222}
background = #232323
background-alt = #443B351
;foreground = ${xrdb:color7:#222}
foreground = #000000
foreground-alt = #000000
;primary = #ffb52a
primary = #ffffff
secondary = #e60053
alert = #D7B292

occupied = #AAA79B
empty = #625A53

[bar/center]
width = 100%
height = 24pt
radius = 6
fixed-center = true
offset-x = 0%

; dpi = 96

;background = #232136
;background = #F5F5F5
background = #FFFFFF
foreground = ${colors.foreground}

line-size = 3pt

;border-size = 0pt
border-color = #00FFFFFF
border-top-size = 20
border-left-size = 19
border-right-size = 19
;border-bottom-size = -20

padding-left = 0
padding-right = 1

module-margin = 1

#separator = |
#separator-foreground = ${colors.disabled}

font-0 = "SourceCodePro-Regular:size=10;2"
font-1 = "FontAwesome:size=10;2"
font-2 = "feather:size=10;3" 
font-3 = "Iosevka Nerd Font:style=Medium:size=18;4"

modules-left = sep rofimenu sep ewmh
modules-center = text
modules-right = time memory battery cpu sep

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; tray-position = right

; wm-restack = generic
; wm-restack = bspwm
; wm-restack = i3

; override-redirect = true

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

label-mounted = %{F#F0C674}%mountpoint%%{F-} %percentage_used%%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.primary}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 1

format = <label>
format-prefix = 
format-prefix-foreground = ${colors.foreground-alt}
# format-background = ${color.background}

label = " %gb_used%"

[module/cpu]
type = internal/cpu
interval = 1

format = <label>
format-prefix = 
format-prefix-foreground = ${colors.foreground-alt}
# format-background = ${color.background}

label = " %percentage%%"

[module/battery]
type = internal/battery   
poll-interval = 2

; Change it for yourself   
; ls /sys/class/power_supply/

battery = BAT0
adapter = ADP0 
full-at = 99
time-format = %H:%M

format-charging = <label-charging>
format-charging-prefix = ""
format-charging-prefix-foreground = ${colors.foreground-alt}
# format-charging-prefix-background = ${color.background}

format-discharging = <label-discharging>
format-discharging-prefix = ""
# format-discharging-prefix-foreground = ${color.pink}
# format-discharging-prefix-background = ${color.background}

format-full = <label-full>
format-full-prefix = 
# format-full-prefix-foreground = ${color.red}
# format-full-prefix-background = ${color.background}

label-charging = " %percentage%%"
# label-charging-background = ${color.background}

label-discharging = " %percentage%%"
# label-discharging-background = ${color.background}

label-full = " Full"
# label-full-background = ${color.background}

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#F0C674}%ifname%%{F-} %essid% %local_ip%

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#F0C674}%ifname%%{F-} %local_ip%

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S

label = %date%
label-foreground = ${colors.primary}

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini

[module/ewmh]
type = internal/xworkspaces
enable-scroll = true
format-padding = 0
label-active = " ● "
label-occupied = " ○ "
label-urgent = " ○ "
label-empty = " ○ "
label-active-foreground = ${colors.foreground-alt}
label-occupied-foreground = ${colors.occupied}

[module/rofimenu]
type = custom/text

content =  MyFRA
content-foreground = ${colors.foreground-alt}



; "click-(left|middle|right)" will be executed using "/usr/bin/env sh -c $COMMAND"
click-left = exec $HOME/.config/rofi/launchers/type-1/launcher.sh


[module/sep]
type = custom/text
content = " "

[module/text]
type = custom/text
content = "MY & FRH"

[module/time]
type = internal/date
interval = 1

;date = %a %d %b
time = %Y-%m-%d %I:%M:%S %p
;time = %I:%M %p
;date-alt = %A %d %B %Y
;time-alt = %I:%M:%S %p

format = <label>
# format-prefix = " "
format-prefix-foreground = ${colors.foreground-alt}
# format-background = ${color.background}

label = %time%
label-foreground = ${colors.foreground-alt}
